<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>坂戸市道路幅員マップ</title>
    <script src="render.js" defer></script>

    <script>
        /* info-btnをクリックしてshowLegendを表示/非表示にする */
        document.addEventListener('DOMContentLoaded', function () {
            const infoBtn = document.getElementById('info-btn');
            const roadWidthLegend = document.getElementById('road-width-legend');

            infoBtn.addEventListener('click', function (event) {
                event.preventDefault();
                if (roadWidthLegend.style.display === 'none'
                    || roadWidthLegend.style.display === '') {
                    roadWidthLegend.style.display = 'block';
                } else {
                    roadWidthLegend.style.display = 'none';
                }
            });
        });

    </script>
</head>

<body>
    <div class="map-container">
        <div id="map" style="width: 100%; height: 100dvh;"></div>

        <!-- 地図の上に重ねる矩形（テキストボックス） -->
        <!-- <div class="map-overlay">
            データ出典：
            <a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N13-2024.html" target="_blank"
                rel="noopener noreferrer">
                国土交通省国土数値情報ダウンロードサイト
            </a>
        </div> -->
        <div id="map-reticle">+</div>
        <div id="road-info"></div>
        <div id="road-width-legend"></div>
        <div id="info-btn">
            <a href="#" id="info-btn-link">
                <img src="icons/information-circle.svg" alt="情報" id="info-btn-icon" />

            </a>
        </div>
    </div>

</body>

</html>
